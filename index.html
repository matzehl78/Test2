<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#12161f">
  <title>Spielekiste</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="menu">
    <h1>Spielekiste</h1>
    <p class="sub">Klassische Spielprinzipien, offline spielbar.</p>
    <div id="grid"></div>
  </main>

  <main id="game" hidden>
    <header>
      <button id="back" aria-label="Zurück zur Übersicht">←</button>
      <h2 id="title"></h2>
      <div class="stats">
        <span id="info"></span>
        <span>Punkte <b id="score">0</b></span>
        <span>Best <b id="best">0</b></span>
      </div>
      <button id="pause" aria-label="Pause">⏸</button>
      <button id="restart" aria-label="Neu starten">↻</button>
    </header>
    <div id="stagewrap">
      <div id="stage"></div>
      <div id="overlay" hidden>
        <div class="box">
          <h3 id="ov-title"></h3>
          <p id="ov-text"></p>
          <button id="ov-btn"></button>
        </div>
      </div>
    </div>
    <p id="help"></p>
    <div id="pad"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
